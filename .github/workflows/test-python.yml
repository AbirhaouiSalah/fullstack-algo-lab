name: Test Python Algorithms

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "algorithms/**/*.py"
      - "algorithms/requirements-dev.txt"
      - "pyproject.toml"
      - ".github/workflows/test-python.yml"
  push:
    branches: [main]
    paths:
      - "algorithms/**/*.py"
      - "algorithms/requirements-dev.txt"
      - "pyproject.toml"
      - ".github/workflows/test-python.yml"

jobs:
  pytest:
    name: Pytest algorithms
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: algorithms/requirements-dev.txt

      - name: Install Python tooling
        run: python -m pip install -r algorithms/requirements-dev.txt

      - name: Run pytest
        shell: bash
        run: |
          set -o pipefail
          set +e
          python algorithms/test-all.py --summary --benchmark-all 2>&1 | tee python-results.txt
          test_status=${PIPESTATUS[0]}
          set -e
          cat python-results.txt >> "$GITHUB_STEP_SUMMARY"
          exit "$test_status"

      - name: Upload Python results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-test-and-benchmark-results
          path: python-results.txt